id: repd
title: Renewable Energy Planning Database (Scotland)
geography: scotland
clip: land+sea
unit: point
licence: OGL-3.0
vintage: "REPD Q2 2026 (2026-07)"
attribution: >-
  Contains public sector information licensed under the Open Government
  Licence v3.0 from the Department for Energy Security and Net Zero.
source:
  type: postgis_table
  table: repd_sites
  id_field: ref_id
  where: "TRUE"
geometry: point
refresh: {cron: "0 5 1 */3 *", max_mb: 50, max_s: 600}
serve: {mode: pmtiles, simplify_m: 0, precision_dp: 6, max_mb: 15}
zoom: {min: 0, max: 14, low_zoom: cluster}
style:
  circle: {circle-color: "#E69F00", circle-radius: 4.5, circle-stroke-width: 1, circle-stroke-color: "#ffffff", circle-opacity: 0.9}
legend:
  - {label: "Renewable energy sites (DESNZ REPD)", color: "#E69F00"}
lineage: {derived_from: [], method: source, roll_up_to: [dz2022, council, scotland]}
keep_fields: [site_name, technology_type, development_status_short, installed_capacity_mw, planning_authority]
tiles:
  budget:
    total_mb: 15
    tile_kb: 500
    z0_7_mb: 2
