# Professional source registry — open or licensed only.
# Scraping property portals is forbidden (see docs/DATA_LICENSING.md).

policy:
  allow_portal_scraping: false
  preferred_sales_authority: "Registers of Scotland"
  notes: >
    England & Wales HM Land Registry Price Paid is not a substitute for
    Scottish completed sales. Use ROS open products or licensed extracts.

hpi:
  name: UK House Price Index
  licence: OGL
  role: council_level_average_price_for_residual_mv
  base_url: https://publicdata.landregistry.gov.uk/market-trend-data/house-price-index-data
  average_prices_template: Average-prices-{period}.csv
  indices_template: Indices-{period}.csv
  period: "2026-03"
  scotland_region_code: S92000003

postcodes:
  name: postcodes.io
  licence: open
  role: geocoding
  api_url: https://api.postcodes.io/postcodes

councils:
  # Context only. Valuation does not flag a whole council as rural.
  rural_codes:
    - S12000013  # Na h-Eileanan Siar
    - S12000017  # Highland
    - S12000023  # Orkney Islands
    - S12000027  # Shetland Islands
    - S12000035  # Argyll and Bute

urban_rural:
  name: Scottish Government Urban Rural Classification 2022
  licence: Open Government Licence v3.0
  credit: "Copyright Scottish Government, contains Ordnance Survey data © Crown copyright and database right 2022."
  url: https://maps.gov.scot/ATOM/shapefiles/SG_UrbanRural_2022.zip
  sha256: 1b18bce2d4201d5f99dfd3bdacbf9fb5bc7a966294cee94262165e2c398d85a9
  lookup: data/processed/sg_urban_rural_2022_urban_20m.geojson
  lookup_sha256: c5225baaa64fdebfa5698fb7857c6914aab683662e1a641c0fc4a52108737573
  classes_urban: "1-4"
  simplify_metres: 20

boundaries:
  councils:
    source_url: https://raw.githubusercontent.com/martinjc/UK-GeoJSON/master/json/administrative/gb/lad.json
    simplify_tolerance_degrees: 0.0008
  glasgow_ward_18:
    source_url: https://www.boundaries.scot/wp-content/uploads/2025/09/4th_Review_2007_2017_All_Scotland_wards_1758892796.zip
    council_name: Glasgow City
    ward_number: 18
    ward_name: East Centre
    validation_label: "Glasgow Ward 18 — East Centre (Wightman validation case study)"

parcels:
  name: ROS INSPIRE cadastral parcels (WMS)
  role: parcel_geometry_lookup
  wms_url: https://ros-inspire.themapcloud.com/maps/wms
  wms_layer: CP.CadastralParcel
  query_delta_degrees: 0.001
  # Keep short so map tiles fail soft (transparent) instead of hanging the UI
  timeout_seconds: 6

sales:
  status: scaffolded
  authority: Registers of Scotland
  fixture_path: data/fixtures/sales/ward18_synthetic.jsonl
  licensed_dir: data/licensed
  schema: backend/datasources/sales_schema.py
  forbidden:
    - zoopla_scrape
    - rightmove_scrape
    - espc_scrape
    - unofficial_scraped_dumps

what3words:
  role: place_grid_and_optional_address
  grid: 3m_aligned
  api_env: W3W_API_KEY

rebuild_costs:
  role: drc_for_residual
  config_path: data/config/agr.yaml  # valuer_roll.rebuild

map_layers:
  council_metrics:
    role: choropleth_value_and_context
    endpoint: /layers/councils
    metrics:
      - agr_plot
      - rent_per_sqm
      - house_price
      - agr_price_pct
      - land_share
      - site_capital
      - simd
      - pop_density
  context_stats:
    path: data/processed/context_by_council.json
    simd: SIMD 2020v2 local authority shares (SG open)
    population: NRS mid-year council estimates (open, rounded)
  overlays:
    - id: boundaries
      source: ROS INSPIRE WMS
    - id: cell_grid
      source: viewport W3W residual grid
    - id: method
      source: valuation method flag on council metrics
    - id: vdl
      source: SVDLS FeatureServer (OGL)
      endpoint: /layers/open/vdl
    - id: public_land
      source: SG PublicLand_2024_Update FeatureServer
      endpoint: /layers/open/public-land
      note: Five national bodies only; not a title; not local-authority land
  # Context layers that can later take a weight. They do not change a parcel
  # rent. The allowlist and the licences live in backend/spatial/context_tiles.py.
  # Left off that list: James Hutton land capability; OS Open Zoomstack
  # (no public map service); small-area population and jobs (tables, not a
  # map service); wires, mains and broadband.
