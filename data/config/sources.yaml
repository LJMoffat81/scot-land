    council_name: Glasgow City
    ward_number: 18
    ward_name: East Centre
    validation_label: "Glasgow Ward 18 — East Centre (Wightman validation case study)"

parcels:
  name: ROS INSPIRE Index Polygons (cadastral parcels)
  product: INSPIRE Index Polygons (CP.CadastralParcel)
  role: parcel_geometry_lookup_and_map_layer
  # Laurie ruling Oct 2026: RoS grants Index Polygons under OGL v3 (the 2017 OS
  # INSPIRE end-user licence linked from RoS's dataset guide is an RoS error).
  licence: OGL-3.0
  licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  attribution: >-
    © Crown copyright. Reproduced with the permission of Registers of Scotland.
    Contains OS data © Crown copyright and database right 2026.
  source_url: https://www.ros.gov.uk/open-data
  # Interactive catalogue (legacy host). Self-fetch uses download_api below.
  download_url: https://ros.locationcentre.co.uk/inspire/
  download_service: https://ros-inspire.themapcloud.com/
  download_api: https://ros-inspire.themapcloud.com/maps/download/ros-cp.cadastralparcel/{code}
  counties_module: backend/etl/inspire_counties.py
  pilot_counties: [MID, FFE]   # Edinburgh (Midlothian) + Fife
  vintage: live-WMS; PostGIS load stamp in inspire_parcels_meta
  wms_url: https://ros-inspire.themapcloud.com/maps/wms
  wms_layer: CP.CadastralParcel
  postgis_table: inspire_parcels
  bbox_endpoint: /layers/parcels
  tile_endpoint: /layers/parcels/tiles/{z}/{x}/{y}
  # One command each (from backend/, DATABASE_URL set):
  ingest_pilot: python -m etl.ingest_inspire_parcels --pilot --replace
  ingest_all: python -m etl.ingest_inspire_parcels --all --replace
  ingest_fixture: python -m etl.ingest_inspire_parcels --fixture --replace
  ci_fixture: backend/tests/fixtures/cadastral_index_polygons.geojson
  refresh_doc: scripts/data/README-inspire.md
  # Self-fetch uses temp dirs only — never writes data/external/
  query_delta_degrees: 0.001
  # Keep short so map tiles fail soft (transparent) instead of hanging the UI
  timeout_seconds: 6
  gaps:
    - Sasine titles without Land Register polygons
    - Private owner names are not in the open INSPIRE product
    - Index polygons are registered extents, not a title sheet
    - RoS publishes 33 registration counties (Edinburgh = Midlothian/MID)
    - CI uses a synthetic fixture only; production self-fetches county zips


hydro_sites:
  name: SEPA Hydropower Sites
  role: natural_capital_extractive_overlay
  publisher: Scottish Environment Protection Agency (SEPA)
  licence: OGL-3.0
  licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  attribution: >-
    Contains public sector information licensed under the Open Government
    Licence v3.0. © SEPA. Licensed hydropower sites under CAR that abstract
    water for hydropower — site points, not a title, not a rent.
  source_url: >-
    https://www.data.gov.uk/dataset/5750f8e5-d51b-4e75-a8d6-403a0d1ded81/hydropower_sites
  atom_url: https://map.sepa.org.uk/atom/SEPA_Hydropower_Sites.atom
  shapefile_wgs84_url: >-
    https://map.sepa.org.uk/atom/Data/SEPA_Hydropower_SITES_WGS84_shp.zip
  vintage: "SEPA ATOM package (feed updated 2018-08-01)"
  commons_class: extractive
  value_tier: proxy
  publication_status: ok
  postgis_table: hydro_sites
  bbox_endpoint: /layers/open/hydro
  ingest: python -m etl.ingest_hydro_sites
  gaps:
    - CAR hydropower abstractions only — not the full CAR water register
    - Points are licensed sites, not lease polygons or Land Register titles
    - No £ rent on this overlay; separate from surface rent (la-calc)
    - Full extract is not committed; load via ingest into PostGIS

sepa_car:
  name: SEPA CAR licences (natural capital)
  role: natural_capital_extractive_overlay
  publisher: Scottish Environment Protection Agency (SEPA)
  licence: OGL-3.0
  # Confirmed on SEPA Environmental data → Authorisations (Open Government Licence).
  licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  attribution: >-
    Contains public sector information licensed under the Open Government
    Licence v3.0. © Scottish Environment Protection Agency. CAR Simple (194)
    and Registration (195) from Open/SEPA_Reference MapServer — ingested to
    PostGIS at load time; never proxied live to clients. Not a title; not a rent.
  source_url: https://www.sepa.org.uk/environment/environmental-data/
  mapserver_url: >-
    https://map.sepa.org.uk/server/rest/services/Open/SEPA_Reference/MapServer
  mapserver_layers:
    - id: 194
      car_layer: simple
      label: CAR Simple Licenced Site
      layer_url: >-
        https://map.sepa.org.uk/server/rest/services/Open/SEPA_Reference/MapServer/194
    - id: 195
      car_layer: registration
      label: CAR Registration
      layer_url: >-
        https://map.sepa.org.uk/server/rest/services/Open/SEPA_Reference/MapServer/195
  commons_class: extractive
  value_tier: market
  publication_status: ok
  adds_to_surface_rent: false
  postgis_table: sepa_car_licences
  bbox_endpoint: /layers/open/sepa-car
  ingest: python -m etl.ingest_sepa_car
  gaps:
    - API serves PostGIS only — MapServer is never proxied to clients
    - Layers 194 (simple) and 195 (registration) only — not CAR Complex (198)
    - No £ rent — natural-capital licence inventory only
    - Full extract is not committed; load via ingest into PostGIS

public_land:
  name: Scottish Public and Crown Estate Land 2024
  role: public_sector_holdings_overlay
  licence: unverified/not open
  public_map: hidden
  attribution: >-
    Scottish Public and Crown Estate Land 2024. Scottish Government
    dashboard only — no verified open licence. Hidden from the public map
    until an OGL-licensed source is confirmed. Five bodies only —
    not exhaustive, not local-authority land, not a title.
  source_url: https://www.arcgis.com/apps/dashboards/a10668ccd4784209bf22e3adcef6b897
  feature_server: >-
    https://services-eu1.arcgis.com/4QkhM5AS8YOlkb6T/arcgis/rest/services/PublicLand_2024_Update/FeatureServer/8
  vintage: "2024"
  bbox_endpoint: /layers/open/public-land
  bodies:
    - Forestry and Land Scotland
    - NatureScot
    - Scottish Crown Estate
    - Scottish Water
    - Crofting Agricultural Holdings
  gaps:
    - Local-authority land holdings (Spatial Hub login — not mirrored)
    - Common Good spatial file (no single open national layer)
    - Holdings outside the five published bodies are not shown
    - Overlay is indicative — confirm title on ScotLIS

common_good:
  name: Common Good registers and indicative spatial sources
  role: ownership_linked_registers
  status: linked
  config_path: data/config/common_good.yaml
  endpoint: /api/common-good.json
  licence: >
    Council register pages (public web). Fife indicative titles under
    OS Public Sector End User Licence - INSPIRE — linked metadata only,
    not redistributed through this API.
  licence_url: >-
    https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  attribution: >
    Common Good is a statutory LA register under the Community Empowerment
    (Scotland) Act 2015. No national open spatial layer. Verified council
    links only; gaps stay visible.
  guidance_url: >-
    https://www.gov.scot/publications/community-empowerment-common-good-property-guidance-local-authorities/
  spatial_sources:
    - id: fife_common_good_titles
      council: Fife
      metadata_url: >-
        https://spatialdata.gov.scot/geonetwork/srv/api/records/7a1bbc72-252c-4cd0-beca-ad3180875524
      feature_server: >-
        https://arcgis-live-as.fife.gov.uk/server/rest/services/Hosted/Fife_Council_Common_Good/FeatureServer/0
      host_note: TLS certificate expired when checked 2026-10-12 — not proxied
  gaps:
    - No national open Common Good polygon layer
    - Most LA registers are PDF/XLSX without open WFS/GeoJSON
    - Spatial Hub amalgamated assets require login
    - Fife extents are indicative and OS INSPIRE EUL — not mirrored here

vdl:
  name: Scottish Vacant and Derelict Land Survey (SVDLS)
  role: vacant_and_derelict_site_overlay
  licence: OGL-3.0
  licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  attribution: >-
    Scottish Vacant and Derelict Land Survey. Contains public sector
    information licensed under the Open Government Licence v3.0. Contains
    data from Improvement Service under OGL, supplied by Scotland's local
    planning authorities and Loch Lomond & The Trossachs National Park
    Authority. © Scottish Government. Survey polygons, not a title.
  register_url: >-
    https://www.gov.scot/publications/the-scottish-vacant-and-derelict-land-survey-site-register/
  publication_url: >-
    https://www.gov.scot/publications/scottish-vacant-and-derelict-land-survey-2025/
  spatial_hub_url: https://data.spatialhub.scot/dataset/vacant_and_derelict_land-is
  feature_server: >-
    https://services2.arcgis.com/Ne8d9gKn5SJ3eAaw/ArcGIS/rest/services/Scottish_Vacant_and_Derelict_Land_2024/FeatureServer/1
  vintage: "2024 Spatial Hub republish (site-level as published)"
  bbox_endpoint: /layers/open/vdl
  # Live FeatureServer queries set inSR/outSR=4326 (WGS84) for the map.
  out_sr: 4326
  site_types:
    - Vacant Land
    - Vacant Land and Buildings
    - Derelict
  # Room decision: Spatial Hub survey > RoS title outline > point (see layers/svdls_geometry.py)
  geometry_precedence:
    - spatialhub_survey
    - ros_title_outline
    - point
  geometry_source_live: spatialhub_survey
  geometry_module: backend/layers/svdls_geometry.py
  gaps:
    - Owner class is a survey field, not legal title
    - Survey polygons are indicative — confirm extent on ScotLIS
    - Spatial Hub vintage may lag the latest SG site register
    - RoS title-outline geometry stays internal until OS/RoS end-user terms cleared

sales:
  status: scaffolded
  authority: Registers of Scotland
  fixture_path: data/fixtures/sales/ward18_synthetic.jsonl
  licensed_dir: data/licensed
  schema: backend/datasources/sales_schema.py
  forbidden:
    - zoopla_scrape
    - rightmove_scrape
    - espc_scrape
    - unofficial_scraped_dumps

what3words:
  role: place_grid_and_optional_address
  grid: 3m_aligned
  api_env: W3W_API_KEY

rebuild_costs:
  role: drc_for_residual
  config_path: data/config/agr.yaml  # valuer_roll.rebuild

map_layers:
  council_metrics:
    role: choropleth_value_and_context
    endpoint: /layers/councils
    metrics:
      - agr_plot
      - rent_per_sqm
      - house_price
      - agr_price_pct
      - land_share
      - site_capital
      - simd
      - pop_density
  context_stats:
    path: data/processed/context_by_council.json
    simd: SIMD 2020v2 local authority shares (SG open)
    population: NRS mid-year council estimates (open, rounded)
  overlays:
    - id: boundaries
      source: ROS INSPIRE WMS
    - id: cell_grid
      source: viewport Scot-LAND squares residual grid
    - id: method
      source: valuation method flag on council metrics
    - id: vdl
      source: SVDLS FeatureServer (OGL) — site-level as published
      endpoint: /layers/open/vdl
      licence: OGL-3.0
      licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
    - id: public_land
      source: SG PublicLand_2024_Update FeatureServer (dashboard only)
      endpoint: /layers/open/public-land
      licence: unverified/not open
      public_map: hidden
      note: >-
        Five national bodies only; not a title; not local-authority land.
        Hidden from the public map until an OGL-licensed source is confirmed.
    - id: hydro_sites
      source: SEPA Hydropower Sites ATOM shapefile (OGL) via PostGIS
      endpoint: /layers/open/hydro
      licence: OGL-3.0
      value_tier: proxy
      note: Natural-capital extractive sites only — no £ rent
    - id: sepa_car
      source: SEPA_Reference MapServer 194/195 → PostGIS (never client-proxied)
      endpoint: /layers/open/sepa-car
      licence: OGL-3.0
      value_tier: market
      note: Ingest with python -m etl.ingest_sepa_car; API PostGIS only; no £ rent
  # Context layers that can later take a weight. They do not change a parcel
  # rent. The allowlist and the licences live in backend/spatial/context_tiles.py.
  # SEPA flood MapServer is not allowlisted — OGL download → PostGIS only.
  # Hutton LCA is a separate open layer (not a context tile proxy).
  # Left off: OS Open Zoomstack; small-area population/jobs; wires/mains/broadband.
