# Tax scenario approved defaults (v0.1, Oct 2026) — Laurie approved.
# Still configurable via this file. publication_status=blocked until Valuation
# re-passes and GIS checks the zone-to-council lookup. Internal only; no public £.
# S1 per-council targets: Scottish Government Local Government Finance (OGL-3.0) —
# SLGFS 2024-25 Table I Council Tax + NDRI Table 2 contributable amount (year recorded
# per field). National single-rate S1 is a separate scenario and is OFF by default.
schema_version: 1
status: approved_defaults
version: '0.1'
approved: 2026-10
approval: approved_laurie_v0_1_oct_2026
label: approved defaults (v0.1, Oct 2026)
owner: Georgist
publication_status: blocked
configurable: true
note: >-
  Configurable scenario settings — approved defaults (v0.1, Oct 2026). No ownership-based exemptions.
  Shadow values are never taxed. Output £ while blocked is Data Zone only; council views show counts.
  Council/Scotland £ roll-up is built behind the temporary blocked setting for reconciliation only. S1
  targets from SG Local Government Finance (OGL).
data_zone:
  vintage: 2011                 # TEMP default + council/Scotland £ roll-up pin
  spine_lookup: datazones.zone_spine
  dz2022_path: address_uprn     # planned unit via #71 UPRN-weighted crosswalk
  rollup_pin_vintage: 2011      # DZ2022/crosswalk roll-up later — not blocking
display_while_blocked:
  gbp_grain: data_zone_only
  council_views: counts_only
  build_council_scotland_rollup: true
  note: >
    Temporary setting switched on while figures are blocked. When unblocked, display policy may change;
    roll-up maths already reconcile Σ councils = Scotland. Roll-up pin stays DZ2011 for now;
    DZ2022 UPRN-weighted scenario path is available separately (vintage=2022).
exemptions:
  ownership_based: false
  shadow_taxed: false
deferral:
  low_income_home_owners: true
  rate: 0.0262
phase_in:
  points_per_year: 10
revenue_sharing:
  council_share: 0.5
  dividend_share: 0.5
scenarios:
  S1:
    id: S1
    label: Revenue swap (solved rate vs SG CT + NDR)
    mode: revenue_swap_solved_rate
    scope: per_council
    national_single_rate:
      enabled: false
      id: S1_national
      label: Revenue swap (national single rate)
    targets: sg_local_government_finance
  S2:
    id: S2
    label: 50% capture
    mode: fixed_capture_rate
    capture_rate: 0.5
  S3:
    id: S3
    label: 85% capture
    mode: fixed_capture_rate
    capture_rate: 0.85
fiscal_targets:
  status: sg_local_government_finance
  version: '0.1'
  targets_status: loaded
  note: >-
    Per-council council tax + non-domestic rates from Scottish Government Local Government Finance publications
    (OGL-3.0). Used as S1 revenue-swap targets.
