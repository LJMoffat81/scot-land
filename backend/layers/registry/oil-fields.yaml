id: oil-fields
title: Offshore hydrocarbon fields
geography: scotland
clip: sea
unit: none
licence: NSTA-OGL
attribution: >-
  Contains information provided by the North Sea Transition Authority
  and/or other third parties.
source:
  type: arcgis
  url: >-
    https://services-eu1.arcgis.com/OZMfUznmLTnWccBc/arcgis/rest/services/Offshore_hydrocarbon_fields_(WGS84)/FeatureServer/0/query
  where: "1=1"
  out_fields: "*"
  page_size: 1000
geometry: polygon
clip_keep_all: false
refresh:
  cron: "0 4 * * 1"
  max_mb: 300
  max_s: 600
serve:
  mode: pmtiles
  simplify_m: 0
  precision_dp: 6
  max_mb: 15
zoom:
  min: 0
  max: 14
  low_zoom: simplify
style:
  fill:
    fill-color: "#8a3b00"
    fill-opacity: 0.28
  line:
    line-color: "#8a3b00"
    line-width: 1.6
    line-opacity: 0.95
legend:
  - {label: "Oil and gas fields", color: "#8a3b00"}
lineage:
  derived_from: []
  method: source
  roll_up_to: []
keep_fields:
  - FIELDNAME
  - FIELDTYPE
  - STATUS
tiles:
  budget:
    total_mb: 4
    tile_kb: 500
    z0_7_mb: 0.5
