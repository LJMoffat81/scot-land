# Staging stack for this office PC. The browser calls same-origin /backend,
# and Next proxies to the API container. Vercel and Railway stay on docker-compose.yml.
# Needs a .env with POSTGRES_PASSWORD (URL-safe; no default, compose refuses to start without it).
#
# Live / auto-deploy: use scripts/ops/deploy-home.ps1 (health-gated canary swap).
# Do not use bare `up -d --build` for production — see docs/HOME_DEPLOY.md.
#
#   docker compose -f docker-compose.home.yml up -d --build db api
#   docker compose -f docker-compose.home.yml exec api python -m etl.load_processed
#   # Data Zone boundaries are not in the repo. Put the boundaries/ dataset (manifest.csv +
#   # dz2011/dz2022_boundaries.geojson) in ../scot-land-local (or set SCOT_LAND_LOCAL_DIR), then:
#   docker compose -f docker-compose.home.yml exec api python -m etl.load_processed --root /app/local --dataset boundaries
#   docker compose -f docker-compose.home.yml up -d --build frontend
#
# The schema is applied by the db container on first init and again (idempotently) by the loader.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scotland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-scotland_wealth}
    # Loopback only, for psql/QGIS on this PC (5433: 5432 is often taken by another local
    # Postgres). Remove to keep the DB internal.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wealth_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    # Named image so deploy-home.ps1 can build once, canary-test, then swap live.
    image: scot-land-home-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        RAILWAY_GIT_COMMIT_SHA: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOME_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
      # Machine-local datasets that are not in the repo (e.g. Data Zone boundaries), read-only.
      - ${SCOT_LAND_LOCAL_DIR:-../scot-land-local}:/app/local:ro
      # Raw open-data downloads for the etl.ingest_* loaders (gitignored data/external/<source>/).
      # Separate writable host folder per source; the rest of ./data stays read-only.
      # First run: create the empty mountpoints data/external/{nrs,crofting,sepa,naturescot,woodland,spatialhub}
      # (gitignored) and ../scot-land-downloads/<same names>, since ./data is mounted read-only.
      - ${SCOT_LAND_DOWNLOADS_DIR:-../scot-land-downloads}/nrs:/app/data/external/nrs
      - ${SCOT_LAND_DOWNLOADS_DIR:-../scot-land-downloads}/crofting:/app/data/external/crofting
      - ${SCOT_LAND_DOWNLOADS_DIR:-../scot-land-downloads}/sepa:/app/data/external/sepa
      - ${SCOT_LAND_DOWNLOADS_DIR:-../scot-land-downloads}/naturescot:/app/data/external/naturescot
      - ${SCOT_LAND_DOWNLOADS_DIR:-../scot-land-downloads}/woodland:/app/data/external/woodland
      - ${SCOT_LAND_DOWNLOADS_DIR:-../scot-land-downloads}/spatialhub:/app/data/external/spatialhub
    environment:
      W3W_API_KEY: ${W3W_API_KEY:-}
      # Spatial Hub GeoServer authkey from gitignored .env (see backend/.env.example).
      # Blank → gated Spatial Hub WFS layers stay "not loaded yet". Never commit a real key.
      SPATIALHUB_AUTHKEY: ${SPATIALHUB_AUTHKEY:-}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://192.168.0.171:3000,http://100.94.77.68:3000
      ALLOW_VERCEL_PREVIEWS: "false"
      PORT: "8000"
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://${POSTGRES_USER:-scotland}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-scotland_wealth}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: scot-land-home-frontend:local
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /backend
        NEXT_PUBLIC_ESRI_BASEMAP_API_KEY: ${NEXT_PUBLIC_ESRI_BASEMAP_API_KEY:-}
    restart: unless-stopped
    ports:
      # Loopback only — matches API/db. Cloudflare Tunnel reaches this via cloudflared on the PC.
      - "127.0.0.1:${HOME_FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: /backend
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api

volumes:
  wealth_pgdata:
