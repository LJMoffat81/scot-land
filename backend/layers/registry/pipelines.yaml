id: pipelines
title: UKCS offshore infrastructure pipelines
geography: scotland
clip: sea
unit: none
licence: NSTA-OGL
attribution: >-
  Contains information provided by the North Sea Transition Authority
  and/or other third parties.
source:
  type: arcgis
  url: >-
    https://services-eu1.arcgis.com/OZMfUznmLTnWccBc/arcgis/rest/services/UKCS%20offshore%20infrastructure%20pipeline%20linear%20ETRS89/FeatureServer/1/query
  where: "CURR_ROW='Y'"
  out_fields: "*"
  page_size: 1000
geometry: line
refresh: {cron: "0 4 * * 1", max_mb: 300, max_s: 600}
serve: {mode: pmtiles, simplify_m: 5, precision_dp: 5, max_mb: 15}
zoom: {min: 0, max: 14, low_zoom: coalesce}
style:
  line:
    line-color: "#5c4a32"
    line-width: 1.4
    line-opacity: 0.9
    line-dasharray: [6, 2, 1.5, 2]
legend:
  - {label: "Pipelines", color: "#5c4a32"}
lineage: {derived_from: [], method: source, roll_up_to: []}
keep_fields: [PIPE_NAME, FLUID, DESCRIPTIO]
tiles:
  budget:
    total_mb: 15
    tile_kb: 500
    z0_7_mb: 2
