# Common Good land — open sources, OGL spatial ingest, honest gaps.
# Checked 2026-10-12. Only OGL spatial_sources are loaded into PostGIS
# (python -m etl.ingest_common_good). Non-OGL sources stay linked.
# Do not scrape Spatial Hub login layers. Do not edit ECONOMIC_RULES here.

checked: "2026-10-12"

national:
  status: live
  gap: No single national Common Good polygon layer — coverage is council-by-council.
  guidance:
    url: https://www.gov.scot/publications/community-empowerment-common-good-property-guidance-local-authorities/
    label: Scottish Government Common Good property guidance
    note: Statutory duty under Community Empowerment (Scotland) Act 2015 s.102 — each LA maintains its own register.
  spatial_hub_assets:
    url: https://data.spatialhub.scot/dataset/council_asset_register-is
    note: Amalgamated council assets require Spatial Hub login — linked, not mirrored.
  open_map_note: >
    Highland Council publishes Common Good sites/buildings as public ArcGIS
    FeatureServers under its open map data OGL policy. Fife indicative titles
    remain OS INSPIRE EUL — linked only, not ingested. The former Fife-only
    catalog row is folded into this Common Good layer.

# Spatial sources. licence must start with OGL to be ingested into PostGIS.
spatial_sources:
  - id: highland_common_good_sites
    council_code: S12000017
    council_name: Highland
    status: live
    kind: ogl_open_layer
    site_kind: site
    label: Highland Common Good sites (OGL)
    catalog_url: https://www.highland.gov.uk/community-support-development/common-good-asset-register
    open_data_url: https://www.highland.gov.uk/information-performance-statistics/open-map-data
    feature_server: >-
      https://services-eu1.arcgis.com/tc4hh050NPZgWq0B/arcgis/rest/services/Common_Good_Sites_(HC_Sites_subset)_-_public_view/FeatureServer/0
    licence: OGL-3.0
    vintage_note: Highland Council public_view FeatureServer (Common Good Sites subset).
    feature_count_observed: 262
    gaps:
      - Highland only for this source
      - Indicative open layer — not a title plan

  - id: highland_common_good_buildings
    council_code: S12000017
    council_name: Highland
    status: live
    kind: ogl_open_layer
    site_kind: building
    label: Highland Common Good buildings (OGL)
    catalog_url: https://www.highland.gov.uk/community-support-development/common-good-asset-register
    open_data_url: https://www.highland.gov.uk/information-performance-statistics/open-map-data
    feature_server: >-
      https://services-eu1.arcgis.com/tc4hh050NPZgWq0B/arcgis/rest/services/Common_Good_Buildings_(HC_Buildings_subset)_-_public_view/FeatureServer/0
    licence: OGL-3.0
    vintage_note: Highland Council public_view FeatureServer (Common Good Buildings subset).
    feature_count_observed: 123
    gaps:
      - Highland only for this source
      - Building footprints — not a title plan

  # Folded former Fife-only catalog entry. OS INSPIRE EUL — not ingested.
  - id: fife_common_good_titles
    council_code: S12000047
    council_name: Fife
    status: linked
    kind: indicative_spatial
    ingest: false
    label: Fife Common Good Titles (indicative; folded into Common Good)
    metadata_url: https://spatialdata.gov.scot/geonetwork/srv/api/records/7a1bbc72-252c-4cd0-beca-ad3180875524
    catalog_url: https://www.data.gov.uk/dataset/4eb5c09c-1150-4978-b6e1-c68b980c56e0/fife-common-good-land-wfs
    feature_server: https://arcgis-live-as.fife.gov.uk/server/rest/services/Hosted/Fife_Council_Common_Good/FeatureServer/0
    licence: OS Public Sector End User Licence - INSPIRE
    vintage_note: Metadata begin date 2005; extents indicative from former-burgh records.
    feature_count_observed: 239
    host_note: >
      FeatureServer TLS certificate expired when checked 2026-10-12.
      Not ingested (non-OGL). Linked under Common Good — no separate Fife map layer.
    gaps:
      - Indicative extents — not a title plan
      - Not OGL — not loaded into PostGIS
      - Former Fife-only catalog row removed; folded here

# Statutory / published register landing pages (non-spatial lists or downloads).
registers:
  S12000036:
    name: City of Edinburgh
    url: https://www.edinburgh.gov.uk/commercial-property-sale-let/common-good-register
    label: Edinburgh Common Good register
    kind: register
  S12000017:
    name: Highland
    url: https://www.highland.gov.uk/community-support-development/common-good-asset-register
    label: Highland Common Good asset registers
    kind: register
  S12000041:
    name: Angus
    url: https://www.angus.gov.uk/communities_and_people/common_good_properties
    label: Angus Common Good properties
    kind: register
  S12000020:
    name: Moray
    url: https://www.moray.gov.uk/benefits-and-grants/council-and-government-grants/common-good-funds/
    label: Moray Common Good funds and asset list
    kind: register
  S12000029:
    name: South Lanarkshire
    url: https://www.southlanarkshire.gov.uk/info/200172/budgets_and_finance/1780/common_good_funds
    label: South Lanarkshire Common Good register
    kind: register
  S12000047:
    name: Fife
    url: https://spatialdata.gov.scot/geonetwork/srv/api/records/7a1bbc72-252c-4cd0-beca-ad3180875524
    label: Fife Common Good Land spatial metadata
    kind: spatial_metadata
    note: Folded into Common Good layer; OS INSPIRE EUL — linked, not ingested.

gaps:
  - No national open Common Good polygon layer
  - PostGIS holds OGL council open layers only (Highland sites/buildings at v1)
  - Fife OS INSPIRE EUL titles linked, not ingested
  - Most councils publish PDF/XLSX registers without open WFS/GeoJSON
  - Spatial Hub amalgamated assets require login
  - Common Good character is not readable from RoS INSPIRE parcels alone
