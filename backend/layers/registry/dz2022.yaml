id: dz2022
title: Data Zones 2022
geography: scotland
clip: land+sea
unit: dz2022
ladder_level: dz2022
nests: true
default_on: true
licence: OGL-3.0
attribution: >-
  Copyright Scottish Government, contains Ordnance Survey data © Crown copyright
  and database right 2026.
source:
  type: postgis_table
  table: dz_boundaries
  id_field: code
  where: "vintage = 2022"
geometry: polygon
refresh:
  cron: "0 5 1 * *"
  max_mb: 300
  max_s: 600
serve:
  mode: pmtiles
  simplify_m: 0
  precision_dp: 6
  max_mb: 15
zoom:
  min: 0
  max: 14
  low_zoom: keep_all
measure: pop_density
style:
  fill:
    fill-color:
      - case
      - - ==
        - - feature-state
          - v
        - null
      - "#d9d9d9"
      - - interpolate
        - - linear
        - - feature-state
          - v
        - 0
        - "#eff3ff"
        - 10
        - "#bdd7e7"
        - 100
        - "#6baed6"
        - 500
        - "#3182bd"
        - 1500
        - "#08519c"
    fill-opacity:
      - interpolate
      - - linear
      - - zoom
      - 4.5
      - 0
      - 5
      - 0.55
      - 14
      - 0.55
      - 15
      - 0.4
  line:
    line-color: "#0b1e3a"
    line-width: 1.05
    line-opacity:
      - interpolate
      - - linear
      - - zoom
      - 8.5
      - 0
      - 9.5
      - 0.6
legend:
  - {label: "Up to 10 people per km²", color: "#eff3ff"}
  - {label: "10–100 people per km²", color: "#bdd7e7"}
  - {label: "100–500 people per km²", color: "#6baed6"}
  - {label: "500–1,500 people per km²", color: "#3182bd"}
  - {label: "1,500–3,000+ people per km²", color: "#08519c"}
  - {label: "No value", color: "#d9d9d9"}
lineage:
  derived_from: []
  method: source
  roll_up_to: [council, scotland]
keep_fields:
  - name
tiles:
  budget:
    total_mb: 60
    tile_kb: 500
    z0_7_mb: 4
clip_keep_all: true

# M1 admission test (charter v2 §4), tagged 1 Nov 2026.
policy_question: []
shows: context
value_layer: false
admission_gaps: [vintage]
