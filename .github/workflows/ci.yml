name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # PostGIS is available for suites that need it; local/unit tests may skip.
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          # Throwaway credentials for a disposable CI container; not a secret.
          POSTGRES_USER: wealth_ci
          POSTGRES_PASSWORD: ci-throwaway-only
          POSTGRES_DB: wealth_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealth_ci -d wealth_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://wealth_ci:ci-throwaway-only@127.0.0.1:5432/wealth_it
      WEALTH_TEST_DATABASE_URL: postgresql://wealth_ci:ci-throwaway-only@127.0.0.1:5432/wealth_it
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: PostGIS extension available
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis; SELECT postgis_version();"
      - name: Import api.main
        run: python -c "import api.main; print(api.main.app.title)"
      - name: Backend suite
        run: python -m pytest -q -p no:cacheprovider -rs

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
