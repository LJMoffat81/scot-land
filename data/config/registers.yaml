# Official register landing pages for Scot-LAND.
# Only URLs that returned HTTP 200 on an official domain (checked 2026-09-01)
# are stored as council-specific. Others fall back to national services.
# Spatial Hub amalgamated CAT / asset / LA-ownership layers still need login
# or are not open — they stay linked/gap, never scraped.

national:
  eplanning:
    url: https://www.eplanning.scot/ePlanningClient/
    label: ePlanning Scotland
    note: National application portal. Not a per-council public-access map.
  tellme_scotland:
    url: https://www.tellmescotland.gov.uk/home/
    label: Tell Me Scotland
    note: National public information notices, including planning adverts.
  scotlis:
    url: https://scotlis.ros.gov.uk/
    label: ScotLIS
    note: Official title sheets. This platform does not replace ScotLIS.
  spatial_hub_cat:
    url: https://data.spatialhub.scot/dataset/community_asset_transfer_register-is
    label: Spatial Hub CAT register
    note: Amalgamated dataset page. Download still requires Spatial Hub login.
  spatial_hub_assets:
    url: https://data.spatialhub.scot/dataset/council_asset_register-is
    label: Spatial Hub council asset register
    note: Amalgamated dataset page. Download still requires Spatial Hub login.
  spatial_hub_la_own:
    url: https://data.spatialhub.scot/dataset/land_ownership-is
    label: Spatial Hub land ownership
    note: Not an open public layer. Shown as a gap, not ingested.

