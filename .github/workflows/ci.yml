name: CI

# pull_request covers PR branches; push only on main so PR pushes do not double-run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.gate.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Paths gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            node frontend/scripts/ci-paths-gate.mjs --push-main
          else
            node frontend/scripts/ci-paths-gate.mjs --base "origin/${{ github.base_ref }}"
          fi

  guard:
    name: Publishability guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/check_publishable.py

  backend:
    name: Backend tests (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          # Throwaway credentials for a disposable CI container; not a secret.
          POSTGRES_USER: wealth_ci
          POSTGRES_PASSWORD: ci-throwaway-only
          POSTGRES_DB: wealth_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealth_ci -d wealth_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # ARCH-1 tests pin PostGIS 16-3.4 (prod image); separate DSN from the suite DB.
      arch1_postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: arch1
          POSTGRES_PASSWORD: arch1
          POSTGRES_DB: arch1
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U arch1 -d arch1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://wealth_ci:ci-throwaway-only@127.0.0.1:5432/wealth_it
      WEALTH_TEST_DATABASE_URL: postgresql://wealth_ci:ci-throwaway-only@127.0.0.1:5432/wealth_it
      WEALTH_REQUIRE_POSTGIS: "1"
      ARCH1_TEST_DSN: postgresql://arch1:arch1@127.0.0.1:5433/arch1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tippecanoe-4f2621186acfec33b63ddf636f665623c0fef2dd
          key: tippecanoe-4f2621186acfec33b63ddf636f665623c0fef2dd
      - name: Install tippecanoe (ARCH-2a pin)
        env:
          TIPPECANOE_SHA: 4f2621186acfec33b63ddf636f665623c0fef2dd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev git
          cache_dir="$HOME/.cache/tippecanoe-$TIPPECANOE_SHA"
          if [ ! -x "$cache_dir/tippecanoe" ]; then
            rm -rf /tmp/tippecanoe-src
            git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe-src
            cd /tmp/tippecanoe-src
            git checkout "$TIPPECANOE_SHA"
            make -j"$(nproc)"
            mkdir -p "$cache_dir"
            cp tippecanoe tippecanoe-decode tile-join "$cache_dir/"
          fi
          sudo cp "$cache_dir/tippecanoe" "$cache_dir/tippecanoe-decode" "$cache_dir/tile-join" /usr/local/bin/
          tippecanoe --version
      - name: PostGIS extension available
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis; SELECT postgis_version();"
          psql "$ARCH1_TEST_DSN" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis; SELECT postgis_version();"
      - name: Alembic upgrade on fresh PostGIS + schema drift check
        run: |
          alembic upgrade head
          python -m db.check_drift
      - name: Load synthetic cadastral fixture into PostGIS
        run: python -m etl.ingest_inspire_parcels --fixture --replace
      - name: Import api.main
        run: python -c "import api.main; print(api.main.app.title)"
      - name: Valuation surface tests
        run: python -m pytest -q -p no:cacheprovider -m 'not real' tests/surface
      - name: Full backend suite (PostGIS tests must run, not skip)
        run: python -m pytest -q -p no:cacheprovider -rs -m 'not real'
      - name: Processed-data manifests (GIS and Data Zones; see docs/processed_data_manifest.md)
        run: python -m etl.load_processed --check

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:catalog-ui-drift
      - run: npm run test:catalog-ui-drift
      - run: npm run test:map-licence-credits
      - run: npm run test:map-colour-ramps
      - run: npm run test:map-legend-wording
      - run: npm run test:forbidden-agr-properties
      - run: npm run test:quality-tags
      - run: npm run test:layer-licence-credits
      - run: npm run test:layers-add2
      - run: npm run test:place-card-hotfix
      - run: npm run test:map-reference-osgb
      - run: npm run test:bng
      - run: npm run test:map-url-state
      - run: npm run test:dz-hierarchy
      - run: npm run test:gbp-live-v1
      - run: npm run test:gbp-live-v1c
      - run: npm run test:gbp-live-v1d
      - run: npm run test:site-rewrite-pr1
      - run: npm run test:site-rewrite-pr2
      - run: npm run test:vdl-dz-3
      - run: npm run check:download-bundles-fresh
      - run: npm run test:site-rewrite-pr3
      - run: npm run test:designer-live-check
      - run: npm run test:site-watch-pr-b
      - run: npm run test:site-watch-pr-c
      - run: npm run test:methodology-nits
      - run: npm run test:site-watch-d3-sea-click
      - run: npm run test:prereview-rent-groups
      - run: npm run test:share-fix
      - run: npm run test:logo-fix
      - run: npm run test:check-meanings
      - run: npm run test:ux10-agr-terminology
      - run: npm run test:proxy-null-body
      - run: npm run check:developers-links
      - run: npm run test:basemap-err-1
      - run: npm run test:esri-csp:selftest
      - run: npm run test:esri-csp
      - run: npm run test:esri-key-guard:selftest
      - run: npm run test:esri-key-guard
      - run: npm run test:privacy-1
      - run: npm run test:ci-dedup-1a
      - run: npm run test:ci-dedup-1b-r2
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:no-test-hook
      - run: npm run test:logo-fix
      - run: npm run test:logo-h3
      - run: npm run test:site-watch-pr-c
      - run: npm run test:methodology-nits

  e2e:
    name: Frontend Playwright e2e
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:esri-key-resolver && npm run test:esri-key-build
      - name: Run Playwright e2e (rewrite / search / chrome gate)
        # Full map/GIS suite still needs a live API for many specs; gate the
        # stub-safe suite under frontend/e2e/ci/ (auto-discovered by
        # playwright.ci.config.ts — do not list files in package.json).
        # Quarantined titles (@quarantine) run in e2e-quarantine only.
        run: npm run test:e2e:ci -- --grep-invert @quarantine
        env:
          CI: "true"

  e2e-quarantine:
    name: Frontend Playwright e2e (quarantine, non-blocking)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run quarantined Playwright e2e
        run: npx playwright test -c playwright.quarantine.config.ts --grep @quarantine
        env:
          CI: "true"
      - name: Quarantine summary
        if: always()
        run: node scripts/ci-quarantine-summary.mjs quarantine-results.json
      - name: Upload Playwright quarantine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-quarantine-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
