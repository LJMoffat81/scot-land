id: native-woodland
title: Native Woodland Survey of Scotland
geography: scotland
clip: land
clip_keep_all: false
unit: none
licence: OGL-3.0
vintage: "NWSS national survey"
attribution: >-
  Native Woodland Survey of Scotland. © Scottish Forestry / Forestry
  Commission. Contains Ordnance Survey data © Crown copyright and database
  right 2026. Licensed under the Open Government Licence v3.0.
source:
  type: postgis_table
  table: native_woodland
  id_field: feature_id
  where: "TRUE"
geometry: polygon
refresh: {cron: "0 5 1 1 *", max_mb: 300, max_s: 600}
serve: {mode: pmtiles, simplify_m: 10, precision_dp: 6, max_mb: 15}
# max 11: data is simplified to serve.simplify_m 10 m; z11 quantises to ~2.7 m
# (half-grid 1.35 m <= simplify_m/5), so z12-14 add bytes, not detail.
zoom: {min: 0, max: 11, low_zoom: coalesce}
style:
  fill: {fill-color: "#009E73", fill-opacity: 0}
  line: {line-color: "#009E73", line-width: 1.2, line-opacity: 0.85, line-dasharray: [2, 1.5]}
legend:
  - {label: "Native Woodland Survey of Scotland", color: "#009E73"}
lineage: {derived_from: [], method: source, roll_up_to: [dz2022, council, scotland]}
# woodland_type only (BATCHA-TILES-FIX-2B): other attributes unused by frontend;
# full official NWSS (~95,814 polygons) measured 17.46 MB after simplify/z11.
keep_fields: [woodland_type]
# Per-layer budget: measured 17.46 MB total / 2.09 MB z0-7; budget = measured + ~25%.
tiles:
  budget:
    total_mb: 22
    tile_kb: 500
    z0_7_mb: 2.7

# M1 admission test (charter v2 §4), tagged 1 Nov 2026.
policy_question: [Q6]
shows: natural_capital
value_layer: false
