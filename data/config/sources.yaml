# Professional source registry — open or licensed only.
# Scraping property portals is forbidden (see docs/DATA_LICENSING.md).

policy:
  allow_portal_scraping: false
  preferred_sales_authority: "Registers of Scotland"
  require_licence_url: true
  forbidden_products:
    - Who Owns Scotland  # paid — do not introduce
  notes: >
    England & Wales HM Land Registry Price Paid is not a substitute for
    Scottish completed sales. Use ROS open products or licensed extracts.
    Every catalogued source must carry licence_url. Prefer OGL-3.0; Hutton LCA
    is accepted under the James Hutton Open Data Licence (not labelled OGL).

hpi:
  name: UK House Price Index
  licence: OGL
  licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  role: council_level_average_price_for_residual_mv
  base_url: https://publicdata.landregistry.gov.uk/market-trend-data/house-price-index-data
  average_prices_template: Average-prices-{period}.csv
  indices_template: Indices-{period}.csv
  period: "2026-03"
  scotland_region_code: S92000003

# Data Zone context (HPI / SIMD / population density) — OGL NRS/SG (+ RoS prices, UK HPI).
# Attributes in PostGIS via gis/dz_context_metrics.csv. Polygons from dz_boundaries (separate).
dz_context_metrics:
  role: data_zone_hpi_simd_population_density
  path: data/processed/gis/dz_context_metrics.csv
  postgis_table: processed.gis_dz_context_metrics
  endpoint: /layers/open/dz-context
  licence: OGL v3.0
  licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  ledger_role: ledger-frame
  ledger_row: "1"
  ui_surface: ledger
  attribution: >
    Contains National Records of Scotland data (small area population estimates)
    © Crown copyright and database right 2026; contains Scottish Government data
    (SIMD 2020v2) © Crown copyright 2025; contains Registers of Scotland data
    (residential sales and price) © Crown copyright 2026; UK House Price Index
    © Crown copyright (HM Land Registry, Registers of Scotland, ONS).
    Licensed under the Open Government Licence v3.0.
  build: python etl/gis/build_dz_context_metrics.py
  sources:
    simd:
      name: SIMD 2020v2 data zone look-up
      publisher: Scottish Government
      licence: OGL v3.0
      url: https://www.gov.scot/publications/scottish-index-of-multiple-deprivation-2020v2-data-zone-look-up/
    population:
      name: NRS small area population estimates
      publisher: National Records of Scotland
      licence: OGL v3.0
      url: https://www.nrscotland.gov.uk/publications/small-area-population-estimates-mid-2024-2022-data-zones/
    zone_area:
      name: Data Zone area (ha) from GIS dz_residential_land
      publisher: Scottish Government boundaries via Scot-LAND GIS
      licence: OGL v3.0
      url: https://www.spatialdata.gov.scot/
    ros_house_prices:
      name: House prices — residential properties sales and price
      publisher: Registers of Scotland / Scottish Government
      licence: OGL v3.0
      url: https://data.gov.scot/dataset/house_prices___residential_properties_sales_and_price
    uk_hpi:
      name: UK House Price Index (council averages, attributed via LA)
      publisher: HM Land Registry / RoS / ONS
      licence: OGL v3.0
      url: https://publicdata.landregistry.gov.uk/market-trend-data/house-price-index-data/
  gaps:
    - UK HPI has no Data Zone series — council HPI is attributed via LA code
    - RoS sale medians are DZ2011 only (2004–2023 open file)
    - Map polygons require dz_boundaries (separate GIS boundaries work)
  metrics:
    - house_price
    - simd
    - pop_density

postcodes:
  name: postcodes.io
  licence: open
  licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  role: geocoding
  api_url: https://api.postcodes.io/postcodes
  # ONS Postcode Directory under OGL — required OS / Royal Mail / National Statistics credits.
  attribution: >-
    Contains OS data © Crown copyright and database right 2026.
    Contains Royal Mail data © Royal Mail copyright and database right 2026.
    Contains National Statistics data © Crown copyright and database right 2026.
    Source: Office for National Statistics licensed under the Open Government
    Licence v.3.0 (ONS Postcode Directory via postcodes.io).
  note: >-
    Service wraps OS Open Data / ONS postcodes; cite OGL for underlying data.

councils:
  # Context only. Valuation does not flag a whole council as rural.
  rural_codes:
    - S12000013  # Na h-Eileanan Siar
    - S12000017  # Highland
    - S12000023  # Orkney Islands
    - S12000027  # Shetland Islands
    - S12000035  # Argyll and Bute

