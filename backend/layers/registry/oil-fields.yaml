  max: 14
  low_zoom: simplify
style: {}
legend: []
lineage:
  derived_from: []
  method: source
  roll_up_to: []
keep_fields:
  - FIELDNAME
  - FIELDTYPE
  - STATUS
tiles:
  budget:
    total_mb: 4
    tile_kb: 500
    z0_7_mb: 0.5
