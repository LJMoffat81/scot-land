    year: 2024-25
    unit: GBP
    source: SG SLGFS 2024-25 Additional Analysis Revenue Table I (General Funding) — Council Tax, £000
      converted to £; OGL-3.0
    publication: Scottish Local Government Finance Statistics (SLGFS) 2024-25 Additional Analysis — Revenue
      Table I
    licence: OGL-3.0
  business_rates:
    year: 2025-2026 [n]
    unit: GBP
    source: SG Non-domestic rates income statistics Table 2 contributable amount; OGL-3.0
    publication: Non-domestic rates income statistics — Table 2 contributable amount
    licence: OGL-3.0
    provisional: true
  national:
    council_tax_gbp: 2996849000
    business_rates_gbp: 3079138735
    council_tax_year: 2024-25
    business_rates_year: 2025-2026 [n]
