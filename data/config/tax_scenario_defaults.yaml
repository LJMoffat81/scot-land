# Tax scenario DRAFT DEFAULTS — NOT finalised. Laurie must approve before any public use.
# Status: draft_defaults / pending_laurie. publication_status=blocked. Internal only.
# Per-council council_tax + business_rates (NDR) are research placeholders for S1
# revenue-swap solve. Allocated from national agr.yaml basket mid-year placeholders
# (£2.8bn CT + £2.8bn NDR) proportional to DZ2011 zone counts — NOT official stats.
# National single-rate S1 is a separate scenario and is OFF by default.
schema_version: 1
status: draft_defaults
approval: pending_laurie
label: "DRAFT DEFAULTS"
owner: Georgist
publication_status: blocked
note: >
  Configurable scenario settings marked DRAFT DEFAULTS. Laurie still has to approve.
  No ownership-based exemptions. Shadow values are never taxed. Output £ while blocked
  is Data Zone only; council views show counts. Council/Scotland £ roll-up is built
  behind the temporary blocked setting for reconciliation only.

data_zone:
  vintage: 2011                 # one Data Zone version throughout (spine + surface)
  spine_lookup: datazones.zone_spine   # zone → la_code / la_name (e.g. S01010117 → Glasgow City)

# TEMP while figures are blocked — not a permanent product rule.
display_while_blocked:
  gbp_grain: data_zone_only     # ONLY place £ values are shown for now
  council_views: counts_only
  build_council_scotland_rollup: true   # build behind the setting; still blocked
  note: >
    Temporary setting switched on while figures are blocked. When unblocked,
    display policy may change; roll-up maths already reconcile Σ councils = Scotland.

exemptions:
  ownership_based: false        # no exemptions based on who owns the land
  shadow_taxed: false           # shadow values are never taxed

deferral:
  low_income_home_owners: true
  rate: 0.0262                  # r = 2.62%

phase_in:
  points_per_year: 10           # 10 percentage points a year

revenue_sharing:
  council_share: 0.5
  dividend_share: 0.5           # 50/50 councils and a dividend by default

scenarios:
  S1:
    id: S1
    label: "Revenue swap (solved rate)"
    mode: revenue_swap_solved_rate
    scope: per_council          # rate solved separately for each council vs its CT+NBR
    national_single_rate:
      enabled: false           # separate scenario; OFF by default
      id: S1_national
      label: "Revenue swap (national single rate)"
  S2:
    id: S2
    label: "50% capture"
    mode: fixed_capture_rate
    capture_rate: 0.50
  S3:
    id: S3
    label: "85% capture"
    mode: fixed_capture_rate
    capture_rate: 0.85

fiscal_targets:
