id: naturescot-designations
title: NatureScot protected area designations (SPA, SAC, NNR)
geography: scotland
clip: land+sea
clip_keep_all: false
unit: none
licence: OGL-3.0
vintage: "NNR rev 2026-09-17"
attribution: >-
  Contains NatureScot information licensed under the Open Government Licence
  v3.0. Contains OS data © Crown copyright and database right 2026.
source:
  type: postgis_table
  table: naturescot_designations
  id_field: site_key
  where: "TRUE"
geometry: polygon
refresh: {cron: "0 5 1 * *", max_mb: 200, max_s: 600}
serve: {mode: pmtiles, simplify_m: 10, precision_dp: 6, max_mb: 15}
# max 11: data is simplified to serve.simplify_m 10 m; z11 quantises to ~2.7 m
# (half-grid 1.35 m <= simplify_m/5), so z12-14 add bytes, not detail.
zoom: {min: 0, max: 11, low_zoom: simplify}
style:
  fill: {fill-color: "#009E73", fill-opacity: 0}
  line: {line-color: "#009E73", line-width: 1.6, line-opacity: 0.9, line-dasharray: [4, 1.5, 1, 1.5]}
legend:
  - {label: "Protected nature sites (SPA, SAC, NNR)", color: "#009E73"}
lineage: {derived_from: [], method: source, roll_up_to: []}
keep_fields: [designation_type, pa_code, name, status, site_type, site_ha, european_code]
tiles:
  budget:
    total_mb: 15
    tile_kb: 500
    z0_7_mb: 2

# M1 admission test (charter v2 §4), tagged 1 Nov 2026.
policy_question: [Q6]
shows: natural_capital
value_layer: false
