id: dz2022
title: Data Zones 2022
geography: scotland
clip: land+sea
unit: dz2022
ladder_level: dz2022
nests: true
licence: OGL-3.0
attribution: >-
  Copyright Scottish Government, contains Ordnance Survey data © Crown copyright
  and database right 2026.
source:
  type: postgis_table
  table: dz_boundaries
  id_field: code
  where: "vintage = 2022"
geometry: polygon
refresh:
  cron: "0 5 1 * *"
  max_mb: 300
  max_s: 600
serve:
  mode: pmtiles
  simplify_m: 0
  precision_dp: 6
  max_mb: 15
zoom:
  min: 0
  max: 14
  low_zoom: keep_all
measure: pop_density
style:
  fill:
    fill-color:
      - case
      - - ==
        - - feature-state
          - v
        - null
      - "#d9d9d9"
      - - interpolate
        - - linear
        - - feature-state
          - v
        - 10
        - "#c6dbef"
        - 100
        - "#6baed6"
        - 500
        - "#2171b5"
        - 1500
        - "#08519c"
        - 3000
        - "#08306b"
    fill-opacity:
      - interpolate
      - - linear
      - - zoom
      - 4.5
      - 0
      - 5
      - 0.55
      - 14
      - 0.55
      - 15
      - 0.4
  line:
    line-color: "#0b1e3a"
    line-width: 1.05
    line-opacity:
      - interpolate
      - - linear
      - - zoom
      - 8.5
      - 0
      - 9.5
      - 0.6
legend:
  - {label: "10", color: "#c6dbef"}
  - {label: "100", color: "#6baed6"}
  - {label: "500", color: "#2171b5"}
  - {label: "1500", color: "#08519c"}
  - {label: "3000", color: "#08306b"}
  - {label: "No value", color: "#d9d9d9"}
lineage:
  derived_from: []
  method: source
  roll_up_to: [council, scotland]
keep_fields:
  - name
tiles:
  budget:
    total_mb: 60
    tile_kb: 500
    z0_7_mb: 4
clip_keep_all: true
